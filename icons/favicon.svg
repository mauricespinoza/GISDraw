<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- GISDrawer: curvas de nivel, una unidad geológica con trama, una falla
       con dientes y la plumilla que dibuja el contacto -->
  <defs>
    <linearGradient id="gd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e6f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gd-nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="gd-pat" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <circle cx="2.5" cy="2.5" r=".8" fill="#14532d" fill-opacity=".55"/>
    </pattern>
    <clipPath id="gd-clip"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#gd-bg)"/>
  <g clip-path="url(#gd-clip)">
    <!-- unidad geológica (relleno + trama) -->
    <path d="M-2 64V47c7-4 13-1 19-4s10-11 17-14 12 0 16 2 9 1 16-2v35z" fill="#86efac"/>
    <path d="M-2 64V47c7-4 13-1 19-4s10-11 17-14 12 0 16 2 9 1 16-2v35z" fill="url(#gd-pat)"/>
    <!-- curvas de nivel -->
    <g fill="none" stroke="#7dd3fc" stroke-linecap="round">
      <path d="M-2 37c6-4 11-3 16-6s8-10 14-12 10 0 14 1" stroke-width="1.6" stroke-opacity=".75"/>
      <path d="M-2 27c6-3 10-3 14-5s7-8 12-10 8-1 11-1" stroke-width="1.4" stroke-opacity=".5"/>
      <path d="M-2 17c5-2 8-3 11-4s6-6 10-7" stroke-width="1.2" stroke-opacity=".3"/>
    </g>
    <!-- falla inversa con dientes -->
    <path d="M30 66 44 47" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M32.55 62.54 34.45 59.96 35.92 63.03zM36.05 57.79 37.95 55.21 39.42 58.28zM39.55 53.04 41.45 50.46 42.92 53.53z" fill="#2563eb" stroke="#2563eb" stroke-width=".6" stroke-linejoin="round"/>
  </g>
  <!-- contacto que se está dibujando -->
  <path d="M-2 47c7-4 13-1 19-4s10-11 17-14" fill="none" stroke="#0b1220" stroke-width="2.6" stroke-linecap="round"/>
  <!-- plumilla -->
  <g transform="translate(34 29) rotate(38) scale(1.18)">
    <path d="M0 0-6.2-13.5q-.4-2.6 2-3.6h8.4q2.4 1 2 3.6z" fill="url(#gd-nib)" stroke="#0b1220" stroke-width="1" stroke-linejoin="round"/>
    <path d="M0-1.2v-8.2" stroke="#0b1220" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="-10.6" r="1.5" fill="#0b1220"/>
    <rect x="-5.4" y="-26" width="10.8" height="9.6" rx="2.2" fill="#e2e8f0" stroke="#0b1220" stroke-width="1"/>
    <path d="M-5.4-21.5h10.8" stroke="#94a3b8" stroke-width="1"/>
  </g>
</svg>
