<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1220" />
    <title>GISDrawer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><img src="icons/logo.svg" alt="" width="30" height="30" /><span>GIS<b>Drawer</b></span></div>
        <div class="mode-switch" role="group" aria-label="Modo">
          <button id="btn-mode-canvas" data-tip="Modo Canvas: solo dibujo, sin mapa ni coordenadas">Canvas</button>
          <button id="btn-mode-gis" data-tip="Modo GIS: mapa base, relieve, coordenadas, georreferenciación y formatos GIS">GIS</button>
        </div>
        <div class="menu-wrap">
          <button id="btn-file" class="tb" aria-haspopup="true">Archivo ▾</button>
          <div id="menu-file" class="menu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button id="btn-geom" class="tb" aria-haspopup="true" data-tip="Join, Merge, Split y Hole sobre la selección">Geometría ▾</button>
          <div id="menu-geom" class="menu" hidden></div>
        </div>
        <button id="btn-undo" class="tb icon" data-tip="Deshacer  Ctrl+Z" aria-label="Deshacer">↶</button>
        <button id="btn-redo" class="tb icon" data-tip="Rehacer  Ctrl+Mayús+Z" aria-label="Rehacer">↷</button>
        <span class="sep"></span>
        <button id="btn-snap" class="tb toggle" data-tip="Snapping a vértices y bordes  S">🧲<span class="lbl"> Snap</span></button>
        <button id="btn-trace" class="tb toggle" data-tip="Trace: seguir la geometría existente  K">〰<span class="lbl"> Trace</span></button>
        <button id="btn-guides" class="tb toggle" data-tip="Guías: al dibujar o mover, el punto se alinea (snap ligero) con el nivel (y) o la vertical (x) de otros vértices del dibujo, aunque estén lejos">📐<span class="lbl"> Guías</span></button>
        <button id="btn-joined" class="tb toggle" data-tip="Move Joined: al mover un nodo (herramienta Nodos) se mueven también los nodos de otras líneas y polígonos que lo comparten">🔗<span class="lbl"> Move Joined</span></button>
        <button id="btn-finger" class="tb toggle" data-tip="El dedo dibuja (pantallas sin lápiz)">✍︎<span class="lbl"> Dedo</span></button>
        <span class="sep"></span>
        <label class="scale-box" data-tip="Escala de la vista (Ctrl+1: escala de referencia)"><span id="scale-label">1:</span><input id="in-scale" inputmode="numeric" /><span id="scale-unit"></span></label>
        <button id="btn-redraw" class="tb" data-tip="Recalcula el relieve para la vista actual (el relieve solo se redibuja con este botón o al cambiar sus ajustes)" hidden>↻ Redraw</button>
        <span class="grow"></span>
        <div id="coords" class="coords"></div>
        <button id="btn-google" class="tb icon" data-tip="Cuenta de Google / Drive" aria-label="Cuenta de Google">G</button>
        <button id="btn-help" class="tb icon" data-tip="Atajos de teclado  ?" aria-label="Atajos de teclado">⌨</button>
        <button id="btn-panel" class="tb icon" data-tip="Mostrar / ocultar panel  Tab" aria-label="Panel">☰</button>
      </header>
      <nav id="toolbar"></nav>
      <main id="viewport">
        <div id="page" hidden></div>
        <div id="stage"></div>
        <div id="propbar" role="toolbar" aria-label="Propiedades"></div>
        <div id="input-host"></div>
        <div id="contextbar" hidden></div>
        <div id="status" hidden></div>
        <div id="attribution"></div>
        <textarea id="text-editor" hidden></textarea>
      </main>
      <aside id="panel">
        <div id="tabs"></div>
        <div id="panel-body"></div>
      </aside>
    </div>
    <div id="ctx-menu" class="menu ctx" role="menu" hidden></div>
    <div id="help" role="dialog" aria-label="Atajos de teclado" hidden></div>
    <div id="tip" hidden></div>
    <input type="file" id="file-input" hidden />
    <script type="module" src="src/main.js"></script>
  </body>
</html>
