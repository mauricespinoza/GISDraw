<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#24170f" />
    <title>GISDrawer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><img src="icons/logo.svg" alt="" width="30" height="30" /><span>GIS<b>Drawer</b></span></div>
        <div class="mode-switch" role="group" aria-label="Modo">
          <button id="btn-mode-canvas" data-tip="Modo Canvas: solo dibujo, sin mapa ni coordenadas">Canvas</button>
          <button id="btn-mode-gis" data-tip="Modo GIS: mapa base, relieve, coordenadas, georreferenciación y formatos GIS">GIS</button>
        </div>
        <div class="menu-wrap">
          <button id="btn-file" class="tb" aria-haspopup="true">Archivo ▾</button>
          <div id="menu-file" class="menu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button id="btn-geom" class="tb" aria-haspopup="true" data-tip="Join, Merge, Split y Hole sobre la selección">Geometría ▾</button>
          <div id="menu-geom" class="menu" hidden></div>
        </div>
        <button id="btn-undo" class="tb icon" data-tip="Deshacer  Ctrl+Z" aria-label="Deshacer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button id="btn-redo" class="tb icon" data-tip="Rehacer  Ctrl+Mayús+Z" aria-label="Rehacer"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <span class="sep"></span>
        <button id="btn-snap" class="tb toggle" data-tip="Snapping a vértices y bordes  S"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/><path d="M10 3v8a2 2 0 0 0 4 0V3"/></svg><span class="lbl"> Snap</span></button>
        <button id="btn-trace" class="tb toggle" data-tip="Trace: seguir la geometría existente  K"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c3 0 3-10 6-10s3 10 6 10 3-10 6-10" stroke-dasharray="0"/><circle cx="3" cy="17" r="1.4" fill="currentColor" stroke="none"/><circle cx="21" cy="7" r="1.4" fill="currentColor" stroke="none"/></svg><span class="lbl"> Trace</span></button>
        <button id="btn-guides" class="tb toggle" data-tip="Guías: al dibujar o mover, el punto se alinea (snap ligero) con el nivel (y) o la vertical (x) de otros vértices del dibujo, aunque estén lejos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18M8 3v18" stroke-dasharray="2 2.2"/><circle cx="8" cy="8" r="2"/><circle cx="17" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="1.4" fill="currentColor" stroke="none"/></svg><span class="lbl"> Guías</span></button>
        <button id="btn-joined" class="tb toggle" data-tip="Move Joined: al mover un nodo (herramienta Nodos) se mueven también los nodos de otras líneas y polígonos que lo comparten"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3.6-3.6a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.6 3.6a4 4 0 0 0 5.7 5.7l1-1"/></svg><span class="lbl"> Move Joined</span></button>
        <button id="btn-finger" class="tb toggle" data-tip="El dedo dibuja (pantallas sin lápiz)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a1.8 1.8 0 0 1 3.6 0v6l3.7.7c1.6.3 2.7 1.8 2.5 3.4l-.6 4.1A2.2 2.2 0 0 1 16 21h-5.2c-.8 0-1.5-.4-1.9-1l-3.4-5a1.7 1.7 0 0 1 2.7-2.1L9 14"/></svg><span class="lbl"> Dedo</span></button>
        <span class="sep"></span>
        <label class="scale-box" data-tip="Escala de la vista (Ctrl+1: escala de referencia)"><span id="scale-label">1:</span><input id="in-scale" inputmode="numeric" /><span id="scale-unit"></span></label>
        <button id="btn-redraw" class="tb" data-tip="Recalcula el relieve para la vista actual (el relieve solo se redibuja con este botón o al cambiar sus ajustes)" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="lbl"> Redraw</span></button>
        <span class="grow"></span>
        <div id="coords" class="coords"></div>
        <button id="btn-google" class="tb icon" data-tip="Cuenta de Google / Drive" aria-label="Cuenta de Google">G</button>
        <button id="btn-help" class="tb icon" data-tip="Atajos de teclado  ?" aria-label="Atajos de teclado"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.3 10h.01M12.6 10h.01M15.9 10h.01M18 10h.01M8 14h8"/></svg></button>
        <button id="btn-panel" class="tb icon" data-tip="Mostrar / ocultar panel  Tab" aria-label="Panel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
      </header>
      <nav id="toolbar"></nav>
      <main id="viewport">
        <div id="rot">
          <div id="page" hidden></div>
          <div id="stage"></div>
        </div>
        <div id="page-edit" hidden></div>
        <div id="propbar" role="toolbar" aria-label="Propiedades"></div>
        <div id="input-host"></div>
        <button id="btn-north" class="tb icon" data-tip="Volver el norte arriba" aria-label="Volver el norte arriba" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4 9h-8z"/><path d="M12 21v-6"/><circle cx="12" cy="12" r="9"/></svg></button>
        <div id="contextbar" hidden></div>
        <div id="status" hidden></div>
        <div id="attribution"></div>
        <textarea id="text-editor" hidden></textarea>
      </main>
      <aside id="panel">
        <div id="tabs"></div>
        <div id="panel-body"></div>
      </aside>
    </div>
    <div id="ctx-menu" class="menu ctx" role="menu" hidden></div>
    <div id="help" role="dialog" aria-label="Atajos de teclado" hidden></div>
    <div id="tip" hidden></div>
    <input type="file" id="file-input" hidden />
    <script type="module" src="src/main.js"></script>
  </body>
</html>
